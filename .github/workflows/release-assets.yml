name: Stage release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing draft release (without v)
        required: true
      package_run:
        description: Successful Build packages run ID for this commit
        required: true
permissions:
  contents: read
concurrency:
  group: release-assets-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PACKAGE_RUN: ${{ inputs.package_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/stage_release.py
        env:
          GH_TOKEN: ${{ github.token }}
