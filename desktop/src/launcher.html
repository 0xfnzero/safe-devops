<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>safe-devops</title><link rel="stylesheet" href="launcher.css"></head><body><header><strong>◇ safe-devops</strong><div><button id="theme" type="button">◐</button><button id="language" type="button">English</button></div></header><main><span class="eyebrow" id="eyebrow">DESKTOP TERMINAL</span><h1 id="title">安全边界，从终端开始。</h1><p id="intro">连接团队控制台，直接输入命令。规则、AI 与人工审核协同把关，每一步都有记录。</p><details class="device-info" open><summary id="device-title">设备身份 · 请交给管理员登记</summary><code id="device-id"></code><textarea id="device-public" readonly aria-label="设备 SSH 公钥 / Device SSH public key"></textarea><small id="device-note">私钥受本机系统密钥环保护。每次请求独立签名。</small></details><form id="connect"><label id="label" for="origin">团队控制台地址</label><input id="origin" type="url" placeholder="https://ops.example.com" required autocomplete="url"><button id="submit" type="submit">连接控制台 →</button></form><p id="error" role="alert"></p><small id="note">服务器主动连接控制端。客户端不保存服务器 SSH 私钥或审核签名密钥。</small></main><footer id="footer">safe-devops · 开源 · 自托管</footer><script src="launcher.js"></script></body></html>
